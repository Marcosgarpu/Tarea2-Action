name: Generar documentación con Sphinx
description: Instala las dependencias y genera la documentación HTML a partir de los docstrings.

inputs:
  python-version:
    description: Versión de Python a utilizar
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Instalar dependencias
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r docs/requirements.txt

    - name: Generar HTML con Sphinx
      shell: bash
      run: sphinx-build -W -b html docs/source docs/build/html